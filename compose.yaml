# Aluco – Stufe 0: AdGuard Home (DNS) + NetAlertX (Geräteinventar)
# Start auf dem Server:   docker compose up -d
# Test am Mac:            docker compose -f compose.yaml -f compose.local.yaml up -d
# Anleitung:              docs/stage-0.md
#
# Images sind auf Version + Digest festgelegt; Updates kommen über Dependabot.

name: aluco

x-logging: &logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: aluco-adguardhome
    # Host-Netz: AdGuard sieht die echte IP jedes Geräts (DNS-Protokoll pro Gerät).
    network_mode: host
    restart: unless-stopped
    # Läuft als root, weil AdGuard beim ersten Start Root-Rechte prüft (Docker setzt
    # für Nicht-root keine "ambient capabilities"). Ausgleich: alle Rechte entzogen
    # bis auf die nötigen, keine Rechteausweitung, Dateisystem schreibgeschützt.
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE # Port 53 (DNS) und 80 (Oberfläche)
      - DAC_OVERRIDE # Daten-Ordner gehören im Image dem Benutzer "nobody"
      - FOWNER # AdGuard korrigiert beim Start Dateirechte
      - CHOWN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    volumes:
      - ${ALUCO_DATA_DIR:-./data}/adguardhome/work:/opt/adguardhome/work
      - ${ALUCO_DATA_DIR:-./data}/adguardhome/conf:/opt/adguardhome/conf
    environment:
      TZ: ${TZ:-UTC}
    mem_limit: ${ADGUARD_MEM_LIMIT:-512m}
    pids_limit: 256
    logging: *logging

  aluco:
    build: .
    image: aluco:local
    container_name: aluco
    # Host-Netz: erreicht AdGuard (127.0.0.1:80) und NetAlertX (127.0.0.1:20212) direkt.
    network_mode: host
    restart: unless-stopped
    depends_on: [adguardhome, netalertx]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Nur die Variablen, die der Runner braucht (kein Dashboard-Passwort).
    environment:
      ALUCO_DB_PATH: /data/aluco.db
      TZ: ${TZ:-UTC}
      ALUCO_INTERVAL_SECONDS: ${ALUCO_INTERVAL_SECONDS:-300}
      ALUCO_RETENTION_DAYS: ${ALUCO_RETENTION_DAYS:-30}
      ADGUARD_URL: ${ADGUARD_URL:-}
      ADGUARD_USER: ${ADGUARD_USER:-}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
      NETALERTX_URL: ${NETALERTX_URL:-}
      NETALERTX_API_TOKEN: ${NETALERTX_API_TOKEN:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      ALUCO_NOTIFY_MIN_SEVERITY: ${ALUCO_NOTIFY_MIN_SEVERITY:-medium}
      ALUCO_NOTIFY_MINIMAL: ${ALUCO_NOTIFY_MINIMAL:-false}
      ALUCO_THREAT_FEEDS: ${ALUCO_THREAT_FEEDS:-}
      ALUCO_AI_ENABLED: ${ALUCO_AI_ENABLED:-false}
      ALUCO_AI_MODEL: ${ALUCO_AI_MODEL:-claude-opus-5-5}
      ALUCO_AI_MAX_PER_RUN: ${ALUCO_AI_MAX_PER_RUN:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Ordner muss dem Benutzer 10001 gehören (siehe docs/stage-0.md)
      - ${ALUCO_DATA_DIR:-./data}/aluco:/data
    mem_limit: ${ALUCO_MEM_LIMIT:-256m}
    pids_limit: 64
    logging: *logging

  aluco-web:
    image: aluco:local # gleiches Image wie "aluco"; wird dort gebaut
    container_name: aluco-web
    command: ["web"]
    network_mode: host # Dashboard auf Port ALUCO_WEB_PORT (Standard 8088), nur Heimnetz/VPN
    restart: unless-stopped
    depends_on: [aluco]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Nur die Variablen des Dashboards – keine AdGuard-/NetAlertX-/ntfy-Zugangsdaten.
    environment:
      ALUCO_DB_PATH: /data/aluco.db
      TZ: ${TZ:-UTC}
      ALUCO_DASHBOARD_PASSWORD: ${ALUCO_DASHBOARD_PASSWORD:-}
      ALUCO_WEB_PORT: ${ALUCO_WEB_PORT:-8088}
      ALUCO_WEB_SECURE_COOKIES: ${ALUCO_WEB_SECURE_COOKIES:-false}
      ALUCO_WEB_ALLOWED_HOSTS: ${ALUCO_WEB_ALLOWED_HOSTS:-}
      ALUCO_WEB_HOST: ${ALUCO_WEB_HOST:-0.0.0.0}
      ALUCO_WEB_TRUST_PROXY: ${ALUCO_WEB_TRUST_PROXY:-false}
      ALUCO_AI_ENABLED: ${ALUCO_AI_ENABLED:-false}
      ALUCO_AI_MODEL: ${ALUCO_AI_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${ALUCO_DATA_DIR:-./data}/aluco:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % (os.environ.get('ALUCO_WEB_PORT') or 8088), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${ALUCO_WEB_MEM_LIMIT:-256m}
    pids_limit: 64
    logging: *logging

  caddy:
    # Optional: HTTPS vor dem Dashboard. Start mit: docker compose --profile https up -d
    profiles: [https]
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: aluco-caddy
    network_mode: host # Port ALUCO_HTTPS_PORT (Standard 8443); Dashboard dann nur noch lokal
    restart: unless-stopped
    depends_on: [aluco-web]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      ALUCO_HTTPS_SITES: ${ALUCO_HTTPS_SITES:-https://localhost:8443}
      ALUCO_UPSTREAM: 127.0.0.1:${ALUCO_WEB_PORT:-8088}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ALUCO_DATA_DIR:-./data}/caddy/data:/data # Zertifikate (sichern!)
      - ${ALUCO_DATA_DIR:-./data}/caddy/config:/config
    mem_limit: 128m
    pids_limit: 64
    logging: *logging

  netalertx:
    image: ghcr.io/netalertx/netalertx:26.10.28@sha256:ebce55cdbccc0f71544e6997541fe81db803b8c8bec3079435b8cd0a40d49b7e
    container_name: aluco-netalertx
    # Host-Netz: nötig für ARP-Scan im Heimnetz (funktioniert nur unter Linux).
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN # arp-scan, nmap
      - NET_RAW # rohe Sockets für Scans
      - NET_BIND_SERVICE # nbtscan
      - CHOWN # Entrypoint setzt Rechte auf /data
      - SETUID # Entrypoint wechselt zu Nicht-root
      - SETGID
    sysctls:
      net.ipv4.conf.all.arp_ignore: 1
      net.ipv4.conf.all.arp_announce: 2
    tmpfs:
      - /tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev,async,noatime,nodiratime
    volumes:
      - ${ALUCO_DATA_DIR:-./data}/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 20211
      PGID: 20211
      LISTEN_ADDR: ${NETALERTX_LISTEN_ADDR:-0.0.0.0}
      PORT: ${NETALERTX_PORT:-20211}
      GRAPHQL_PORT: ${NETALERTX_GRAPHQL_PORT:-20212}
    mem_limit: ${NETALERTX_MEM_LIMIT:-1024m}
    pids_limit: 512
    logging: *logging

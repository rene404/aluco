name: CI

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --extra ai --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose-Dateien prüfen
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f compose.yaml -f compose.local.yaml config -q
      - name: Aluco-Image bauen und starten
        run: |
          docker compose build aluco
          docker run --rm aluco:local --version
      - name: Shell-Skripte prüfen
        run: shellcheck scripts/*.sh agent/*.sh

  integration:
    # Ganzer Stack: AdGuard, NetAlertX, Runner, Dashboard, Agent-API, MCP, HTTPS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Integrationstest
        env:
          CI: "true"
        run: scripts/integration-test.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

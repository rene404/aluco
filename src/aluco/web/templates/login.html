{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="login card">
  <h1 class="brand"><svg class="owl" width="32" height="32" viewBox="0 0 28 28" aria-hidden="true"><circle class="owl-head" cx="14" cy="14" r="13"></circle><circle class="owl-eye" cx="9.5" cy="12" r="4"></circle><circle class="owl-eye" cx="18.5" cy="12" r="4"></circle><circle class="owl-pupil" cx="9.5" cy="12" r="1.8"></circle><circle class="owl-pupil" cx="18.5" cy="12" r="1.8"></circle><path class="owl-beak" d="M12.5 17 L14 20 L15.5 17 Z"></path></svg> Aluco</h1>
  <p class="muted">Hausradar für dein Netz</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}

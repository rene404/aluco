{% set fid = "f-" ~ d.mac.replace(":", "") %}
<tr id="device-{{ d.mac.replace(':', '') }}">
  <td><a href="/devices/{{ d.mac }}">{{ d.label }}</a><br><span class="muted mono">{{ d.mac }}</span></td>
  <td class="mono">{{ d.ip or "–" }}</td>
  <td>{{ d.vendor or "–" }}</td>
  <td>{{ d.last_seen | local }}</td>
  <td><input form="{{ fid }}" name="name" value="{{ d.name or '' }}" maxlength="100" aria-label="Name" placeholder="{{ d.hostname or '' }}"></td>
  <td>
    <select form="{{ fid }}" name="trust" aria-label="Vertrauensstufe">
      {% for t in TrustLevel %}<option value="{{ t.value }}" {% if t == d.trust %}selected{% endif %}>{{ TRUST_DE[t] }}</option>{% endfor %}
    </select>
  </td>
  <td><input form="{{ fid }}" type="checkbox" name="protected" aria-label="Schutzliste" {% if d.protected %}checked{% endif %}></td>
  <td>
    <form id="{{ fid }}" method="post" action="/devices/{{ d.mac }}" hx-post="/devices/{{ d.mac }}" hx-target="closest tr" hx-swap="outerHTML">
      <button type="submit" class="small">Speichern</button>
    </form>
    {% if message %}<span class="ok" role="status">{{ message }}</span>{% endif %}
  </td>
</tr>

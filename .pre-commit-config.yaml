# Installieren: uv run pre-commit install   (oder: pre-commit install)
# Versionen sind auf Commit-SHAs festgelegt (Schutz vor manipulierten Tags).
# Eingebundene Fremddateien unverändert lassen (sonst stimmt die SRI-Prüfsumme nicht).
exclude: ^src/aluco/web/static/htmx-[0-9.]+\.min\.js$

repos:
  - repo: local
    hooks:
      - id: check-private-terms
        name: Private Begriffe prüfen
        entry: scripts/check-private-terms.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # nur Syntax; Compose nutzt eigene Tags (!reset, !override)
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
